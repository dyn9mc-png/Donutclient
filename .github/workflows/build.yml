name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - name: Unzip and configure
        run: |
          unzip -q donut-client.zip
          cd donut
          printf 'org.gradle.jvmargs=-Xmx3G\nminecraft_version=1.21.11\nyarn_mappings=1.21.11+build.4\nloader_version=0.18.4\nfabric_version=0.141.1+1.21.11\n' > gradle.properties
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { maven { url 'https://maven.fabricmc.net/' }; gradlePluginPortal(); mavenCentral() } }
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
          repositories { mavenCentral(); maven { url 'https://maven.fabricmc.net/' } }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          tasks.withType(JavaCompile).configureEach { options.release = 21 }
          EOF
      - run: gradle build
        working-directory: donut
      - uses: actions/upload-artifact@v4
        with: { name: donut-client, path: donut/build/libs/*.jar }
